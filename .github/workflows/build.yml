name: Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'   # weekly: pick up the latest PHP patches
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without cache (security update)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true                      # always pull a fresh base image (latest PHP patch)
          no-cache: ${{ inputs.no_cache == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print PHP version in image
        run: docker run --rm --entrypoint php ${{ fromJSON(steps.meta.outputs.json).tags[0] }} -v

      - name: Trigger Coolify deploy
        if: github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
        run: |
          curl -fsS -X GET "${{ secrets.COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
