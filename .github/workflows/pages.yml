name: Project page

# Publishes site/ to GitHub Pages. The domain comes from site/CNAME, the
# repository from github.repository; both replace placeholders at build time.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          site_url="https://$(tr -d '[:space:]' < site/CNAME)"
          cp -r site _site
          find _site -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' \) -exec sed -i \
            -e "s#__SITE__#${site_url}#g" \
            -e "s#__REPO__#${GITHUB_REPOSITORY}#g" \
            -e "s#__DATE__#$(date -u +%F)#g" {} +
          ! grep -rl '__SITE__\|__REPO__\|__DATE__' _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
