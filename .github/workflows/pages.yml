name: Project page

# Publishes site/ to GitHub Pages. The domain comes from site/CNAME, the
# repository from github.repository; both replace placeholders at build time.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          site_url="https://$(tr -d '[:space:]' < site/CNAME)"
          cp -r site _site
          find _site -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' \) -exec sed -i \
            -e "s#__SITE__#${site_url}#g" \
            -e "s#__REPO__#${GITHUB_REPOSITORY}#g" \
            -e "s#__DATE__#$(date -u +%F)#g" {} +
          ! grep -rl '__SITE__\|__REPO__\|__DATE__' _site

      # For IndexNow: does the build differ from what is online right now? Compared with the live
      # page, not with git, so a change whose deploy failed is still reported by the next one.
      - name: Compare with the live page
        id: live
        run: |
          site_url="https://$(tr -d '[:space:]' < site/CNAME)"
          changed=false
          while read -r file; do
            if ! curl -fsS --max-time 20 "${site_url}/${file}" -o live.tmp || ! cmp -s live.tmp "_site/${file}"; then
              echo "changed: ${file}"; changed=true
            fi
          done < <(cd _site && find . -type f \( -name '*.html' -o -name '*.txt' -o -name '*.css' \) -printf '%P\n')
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub sometimes lists a fresh artifact only seconds later, and deploy-pages then fails with
      # 'No artifacts named "github-pages"' (actions/deploy-pages#451). So wait and try again; the
      # artifact is uploaded only once, because a second one would make the lookup ambiguous.
      - run: sleep 10
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # IndexNow: tell Bing, Yandex, Seznam, Naver and Yep that the page changed (Bing also feeds
      # the search of ChatGPT and Copilot). Only when the page really changed; a failure never fails
      # the deploy. The key is public by design: site/<key>.txt proves that we own the domain.
      - name: IndexNow
        if: steps.live.outputs.changed == 'true'
        continue-on-error: true
        run: |
          host="$(tr -d '[:space:]' < site/CNAME)"
          key="$(basename "$(ls site/*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -n 1)" .txt)"
          urls="$(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's#</\?loc>##g')
          https://${host}/llms.txt
          https://${host}/sitemap.xml"
          body="$(jq -n --arg host "$host" --arg key "$key" --arg urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: ($urls | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))}')"
          echo "$body"
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body" -w '\nHTTP %{http_code}\n'
