# Local development and Codespaces: same PHP image as production, code bind-mounted.
#   docker compose up -d
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate
services:
  app:
    build:
      context: .
      target: base
    ports:
      - "8080:8080"
    environment:
      - AUTORUN_ENABLED=false
      - PHP_OPCACHE_ENABLE=0
      - SSL_MODE=off
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=holdout
      - POSTGRES_USER=holdout
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdout"]
      interval: 5s
      retries: 10

volumes:
  db-data:
